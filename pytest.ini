[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Fast unit tests with zero hardware or LLM dependency
    integration: Multi-component integration tests
    hardware: Real physical audio/hardware benchmark tests
    ollama: Local Ollama LLM integration tests
    security: Security gate & permission invariant tests
    release: Release candidate gate & smoke tests
