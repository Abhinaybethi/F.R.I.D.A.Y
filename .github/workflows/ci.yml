name: F.R.I.D.A.Y. Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Configuration & Security Tests
      run: |
        python -m pytest tests/test_config_validation.py tests/test_phase18_gate.py -v

    - name: Run Release Smoke Test
      run: |
        python scripts/release_smoke_test.py
