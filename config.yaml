# F.R.I.D.A.Y. Assistant Configuration
# Structured into Security, Runtime, Voice, Reasoning, and UI sections.

wake_word: "friday"

security:
  dry_run: false
  allow_real_execution: true

tools:
  dry_run: false        # dry-run mode: True = no real execution, False = attempt real
  allow_real_execution: true   # allow real execution: True = enable, False = disabled
  permissions:
    open_app: true
    close_app: true
    open_folder: true
    open_website: true
    search_web: true
    get_time: true
    find_file: true
    open_file: true
    minimize_app: true
    maximize_app: true
    take_screenshot: true
    play_video: true
    greeting: true
    generate_image: true

# Local Qwen-Image-2.1 GGUF generation via stable-diffusion.cpp (sd-cli).
# Nothing loads at startup; the first generation request performs a lazy
# load. All values are overridable via FRIDAY_*_PATH / FRIDAY_QWEN_* env vars
# (see docs/IMAGE_GENERATION.md). Model layout:
#   models/qwen-image/diffusion/*.gguf      (Qwen-Image-2.1 diffusion model)
#   models/qwen-image/text_encoder/*.gguf   (Qwen3-VL-8B-Instruct GGUF)
#   models/qwen-image/vae/*.safetensors     (Qwen-Image-2.1 VAE)
# python -m friday.image setup  downloads all of the above (verified, explicit).
image:
  enabled: true
  provider: "qwen-image"
  executable: "sd-cli"            # FRIDAY_QWEN_SD_EXECUTABLE
  model_path: ""                  # FRIDAY_QWEN_IMAGE_MODEL_PATH ("" = discovery)
  text_encoder_path: ""           # FRIDAY_QWEN_TEXT_ENCODER_PATH
  vae_path: ""                    # FRIDAY_QWEN_VAE_PATH
  output_dir: "output/generated_images"   # FRIDAY_QWEN_OUTPUT_DIR
  device: "auto"                  # auto | cuda | cpu (FRIDAY_QWEN_DEVICE)
  text_encoder_device: "auto"     # auto | cpu | gpu — keep the ~4.3GB text
                                  # encoder off small GPUs (auto => CPU when
                                  # CUDA VRAM < 10 GB). FRIDAY_QWEN_TEXT_ENCODER_DEVICE
  keep_loaded: true               # retains preflight state between requests
  prompt_enhancement: false       # optional prompt suffix augmentation
  # Latency note: on a 6GB GPU with the text encoder on CPU, 768x768 @ 8 steps
  # takes ~5 min. Raising either multiplies that; keep the timeout generous.
  width: 768
  height: 768
  steps: 8
  cfg_scale: 2.5
  sampling_method: "euler"
  flow_shift: 3.0
  vae_tiling: true                # low-VRAM friendly
  diffusion_fa: true              # computes attention in fp32 (Flash Attention)
  offload_to_cpu: true            # keep VRAM footprint low on 6GB-class GPUs
  free_vram_before_generate: true # stop F.R.I.D.A.Y.'s own reasoner server during
                                  # generation so the ~4GB diffusion model stays
                                  # GPU-resident (~2x faster); FRIDAY_QWEN_FREE_VRAM
  extra_args: ""                  # extra tokens appended to each sd-cli run (override
                                  # text_encoder_device placement if they contain --backend), e.g.
                                  #   --model-args qwen_image_2_1_prefix_cache_type=q4_0
  timeout: 900

voice:
  offline_only: true
  wake_word_required: true   # true = wake-gated (IDLE ignores non-wake speech); false = hands-free
  hands_free:                # always-on wake-word listening for the dashboard voice console
    enabled: true
    wake_word: "friday"
    acknowledgement: ["Yes Abhi", "Yes boss"]   # spoken reply after a bare wake; false disables
    silence_ms: 800          # end-of-utterance silence before a segment is transcribed
    command_timeout_seconds: 12   # how long to wait for a command after "hey friday"
    session_timeout_seconds: 300  # inactivity timeout for an active conversation session
    flush_timeout_seconds: 2.5    # pause length that closes a multi-question utterance before one combined answer
  conversation_timeout_seconds: 300   # active-session inactivity timeout (180–300s); wake required again after expiry
  debug:
    save_audio: false
    directory: debug_audio
    playback_audio: false
    max_files: 50
  vad:
    enabled: true
    model_path: "models/vad/silero_vad.onnx"
  stt:
    engine: "faster-whisper"
    model: "small.en"
    device: "auto"              # auto = CUDA on NVIDIA GPUs, otherwise CPU int8
    compute_type: "int8"        # overridden to float16 on CUDA
    language: "en"
  tts:
    engine: "piper"
    fallback_engine: "kokoro"
    kokoro_model: "models/tts/kokoro/kokoro-v1.0.int8.onnx"
    kokoro_voices: "models/tts/kokoro/voices-v1.0.bin"
    piper_model: "models/tts/piper/en_US-lessac-low.onnx"
    piper_config: "models/tts/piper/en_US-lessac-low.onnx.json"
    voice: "af_heart"
    speed: 1.0
    device: "auto"

listening:
  ambient_noise_calibration_seconds: 1
  command_timeout_seconds: 6
  phrase_time_limit_seconds: 8

brain:
  ollama_url: "http://localhost:11434"
  ollama_model: "llama3:latest"

reasoning:
  # Reasoning provider selection.
  # Supported: "ollama" (local Ollama), "llamacpp" (llama.cpp / Bonsai),
  #   "nvidia" (NVIDIA API Catalog — hosted, requires NVIDIA_API_KEY env var).
  # Default is "llamacpp" for backwards compatibility.
  provider: "nvidia"

  # NVIDIA‑specific overrides (only used when provider = "nvidia").
  # These are typically set via environment variables
  #   NVIDIA_API_KEY, NVIDIA_BASE_URL, NVIDIA_MODEL.
  # Config.yaml values are ignored when provider is "nvidia".
  nvidia:
    model: "nvidia/nemotron-3.5-bolt-e4b"       # overridden by NVIDIA_MODEL env var
    base_url: "https://integrate.api.nvidia.com/v1"  # overridden by NVIDIA_BASE_URL env var
    timeout: 30                        # request timeout in seconds

  # Legacy direct fields (still supported for backwards compat;
  # take priority over nvidia.* sub‑block when provider is not "nvidia").
  model: 'C:\AI\models\Bonsai-8B-Q1_0.gguf'
  endpoint: "http://127.0.0.1:8080"
  timeout: 30
  server:
    auto_start: true
    executable: "llama-server"
    context_size: 2048
    startup_timeout: 60

rag:
  enabled: true
  collection: "friday_knowledge"
  persist_dir: ""                 # "" = project .data/rag
  retrieval_k: 15                 # candidates before rerank
  final_k: 5                      # context chunks after rerank
  similarity_threshold: 0.30      # vector relevance floor (all-MiniLM calibrated)
  relevance_min_score: 0.30       # combined rerank floor
  rerank: true
  hybrid: true
  bm25_k1: 1.5
  bm25_b: 0.75
  context_compression: true
  max_context_tokens: 3000
  auto_ingest: true
  include_md: true
  source_dirs: ["docs", "."]
  no_context_message: "I don't have enough relevant information in my knowledge base to answer that confidently."

research:
  enabled: true                  # set false (kill switch) to disable live web research
  provider: "duckduckgo"         # WEB_SEARCH_PROVIDER overrides
  api_key: ""                    # WEB_SEARCH_API_KEY (duckduckgo needs none)
  max_results: 5                 # WEB_SEARCH_MAX_RESULTS
  max_queries: 3                 # generated search queries per request
  timeout: 10                    # per-query timeout in seconds (WEB_SEARCH_TIMEOUT)
  prefer_official: false         # optional official-domain preference

natural_conversation:
  enabled: true                 # FRIDAY_NATURAL_CONVERSATION_ENABLED overrides

# Locally answerable system questions (currently: the current time) are kept
# out of the reasoner. See friday/core/system_commands.py for scope.
system_commands:
  enabled: true                 # FRIDAY_SYSTEM_COMMANDS_ENABLED overrides

# Persistent conversation / task memory (Phase 2). Local SQLite + optional
# ChromaDB semantic index. `enabled: false` makes every memory hook a no-op.
memory:
  enabled: true
  db_path: ".data/memory.db"            # raw history, episodes, facts, tasks
  vector_enabled: true                  # semantic ("meaning") search via Chroma
  vector_path: ".data/rag/conversations"
  vector_collection: "conversation_memory"
  summaries_enabled: true
  summary_min_turns: 4                  # turns before a session summary is generated
  retention_days: 0                     # 0 = keep forever (explicit prune only)
  max_turns_per_session: 0              # 0 = unlimited
  dedupe_window_seconds: 3.0            # absorbs retry/reconnect duplicates
  search_limit: 20
  backup_dir: ".data/backups"

logging:
  level: "INFO"
  file: "logs/friday.log"

ui:
  status_engine: true
  tray_enabled: true
