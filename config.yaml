# F.R.I.D.A.Y. Assistant Configuration
# Structured into Security, Runtime, Voice, Reasoning, and UI sections.

wake_word: "friday"

security:
  dry_run: true
  allow_real_execution: false

tools:
  dry_run: true        # Backward compatibility key
  allow_real_execution: false
  permissions:
    open_app: true
    close_app: true
    open_folder: true
    open_website: true
    search_web: true
    get_time: true
    find_file: true
    open_file: true
    minimize_app: true
    maximize_app: true
    take_screenshot: true

voice:
  offline_only: true
  debug:
    save_audio: false
    directory: debug_audio
    playback_audio: false
    max_files: 50
  vad:
    enabled: true
    model_path: "models/vad/silero_vad.onnx"
  stt:
    engine: "faster-whisper"
    model: "small.en"
    device: "cpu"
    compute_type: "int8"
    language: "en"
  tts:
    engine: "piper"
    fallback_engine: "kokoro"
    kokoro_model: "models/tts/kokoro/kokoro-v1.0.int8.onnx"
    kokoro_voices: "models/tts/kokoro/voices-v1.0.bin"
    piper_model: "models/tts/piper/en_US-lessac-low.onnx"
    piper_config: "models/tts/piper/en_US-lessac-low.onnx.json"
    voice: "af_heart"
    speed: 1.0
    device: "auto"

listening:
  ambient_noise_calibration_seconds: 1
  command_timeout_seconds: 6
  phrase_time_limit_seconds: 8

brain:
  ollama_url: "http://localhost:11434"
  ollama_model: "llama3:latest"

reasoning:
  model: "llama3:latest"
  endpoint: "http://localhost:11434/api/generate"

logging:
  level: "INFO"
  file: "logs/friday.log"

ui:
  status_engine: true
  tray_enabled: true
